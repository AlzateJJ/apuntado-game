name: Validate Apuntado
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: apuntado
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: apuntado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apuntado -d apuntado_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://apuntado:ci-test-only@127.0.0.1:5432/apuntado_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
